<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Binärwerkstatt · Tafelwerk</title>
  <style>
    :root { --paper:#f3efe6; --cream:#fffdf8; --ink:#1a1714; --muted:#6b6560; --accent:#1e3a5f; --line:#e2dcd0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--cream); }
    .bar a { color:var(--muted); text-decoration:none; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .wrap { max-width:920px; margin:0 auto; padding:18px; display:grid; gap:16px; }
    .card { background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .bits { display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:8px; }
    .bit { display:flex; flex-direction:column; align-items:center; gap:6px; }
    .bit button {
      width:100%; aspect-ratio:1; max-height:92px; font-size:1.6rem; font-variant-numeric:tabular-nums;
      border:1px solid var(--line); background:var(--paper); border-radius:12px; cursor:pointer; color:var(--ink);
    }
    .bit button.on { background:var(--accent); color:var(--cream); border-color:var(--accent); }
    .pow { font-size:12px; color:var(--muted); }
    .muted { color:var(--muted); }
    .vals { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .vals div { background:var(--paper); border-radius:12px; padding:12px; }
    .vals strong { display:block; font-size:1.6rem; font-variant-numeric:tabular-nums; margin-top:4px; }
    button.act { font:inherit; min-height:44px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--cream); cursor:pointer; }
    html.embed .bar { display:none; }
  </style>
</head>
<body>
  <header class="bar">
    <a href="/">Tafelwerk</a>
    <strong>Binärwerkstatt</strong>
    <span class="muted">Informatik · Kl. 7–10</span>
  </header>
  <main class="wrap">
    <section class="card">
      <p class="muted" style="margin:0 0 12px">Jedes Bit ist eine Zweierpotenz. Antippen schaltet 0 und 1.</p>
      <div class="bits" id="bits"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="act" type="button" id="inc">+ 1</button>
        <button class="act" type="button" id="dec">− 1</button>
        <button class="act" type="button" id="zero">Null</button>
        <button class="act" type="button" id="full">Alle 1</button>
      </div>
    </section>
    <section class="card">
      <div class="vals">
        <div><span class="muted">Binär</span><strong id="bin">00000000</strong></div>
        <div><span class="muted">Dezimal</span><strong id="decv">0</strong></div>
        <div><span class="muted">Hexadezimal</span><strong id="hex">00</strong></div>
      </div>
      <p class="muted" id="sum" style="margin:14px 0 0; font-variant-numeric:tabular-nums"></p>
    </section>
  </main>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      if (q.has("embed") || window.self !== window.top) document.documentElement.classList.add("embed");
      let bits = [0,0,0,0,1,0,1,0];
      const box = document.getElementById("bits");
      for (let i = 0; i < 8; i++) {
        const wrap = document.createElement("div");
        wrap.className = "bit";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.addEventListener("click", () => { bits[i] = bits[i] ? 0 : 1; paint(); });
        const pow = document.createElement("div");
        pow.className = "pow";
        pow.textContent = "2" + ["⁷","⁶","⁵","⁴","³","²","¹","⁰"][i] + " = " + (1 << (7 - i));
        wrap.appendChild(btn); wrap.appendChild(pow); box.appendChild(wrap);
      }
      function value() {
        return bits.reduce((acc, b, i) => acc + b * (1 << (7 - i)), 0);
      }
      function paint() {
        const v = value();
        [...box.children].forEach((w, i) => {
          const btn = w.querySelector("button");
          btn.textContent = bits[i] ? "1" : "0";
          btn.classList.toggle("on", bits[i] === 1);
        });
        document.getElementById("bin").textContent = bits.join("");
        document.getElementById("decv").textContent = String(v);
        document.getElementById("hex").textContent = v.toString(16).toUpperCase().padStart(2, "0");
        const parts = bits.map((b, i) => b ? (1 << (7 - i)) : null).filter((x) => x !== null);
        document.getElementById("sum").textContent = parts.length
          ? parts.join(" + ") + " = " + v
          : "Kein Bit gesetzt = 0";
      }
      function set(n) {
        n = ((n % 256) + 256) % 256;
        for (let i = 0; i < 8; i++) bits[i] = (n >> (7 - i)) & 1;
        paint();
      }
      document.getElementById("inc").addEventListener("click", () => set(value() + 1));
      document.getElementById("dec").addEventListener("click", () => set(value() - 1));
      document.getElementById("zero").addEventListener("click", () => set(0));
      document.getElementById("full").addEventListener("click", () => set(255));
      paint();
    })();
  </script>
</body>
</html>
