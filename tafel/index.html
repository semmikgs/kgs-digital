<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tafel</title>
<style>
  :root {
    --rail: #eceff3; --rail-edge: #d3dae2; --face: #fff; --face-edge: #ccd5de;
    --ink: #232d38; --muted: #6b7885; --sel: #232d38; --ok: #2e9d5b; --warn: #c62d20;
    --b: 38px; --bp: 28px; --bc: 24px; --gap: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; touch-action: none;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  #app { display: flex; height: 100%; }

  /* Bühne = freier Platz, Blatt = festes 16:9 darin */
  #stage { position: relative; flex: 1; overflow: hidden; background: #dfe4ea; }
  #sheet { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(35,45,56,.16), 0 6px 20px rgba(20,28,36,.14); }
  #sheet canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  #bar { width: 130px; flex: none; background: linear-gradient(180deg, #f3f5f8 0%, var(--rail) 100%);
    border-left: 1px solid var(--rail-edge);
    display: flex; flex-direction: column; justify-content: space-evenly; padding: 6px 7px; }
  .sec { display: grid; gap: var(--gap); }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .rule { height: 1px; background: var(--rail-edge); margin: 0 3px; }

  button { height: var(--b); border: 1px solid var(--face-edge); background: var(--face); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink);
    position: relative; overflow: hidden; box-shadow: 0 1px 1px rgba(35,45,56,.06);
    -webkit-tap-highlight-color: transparent; outline: none; font: inherit; }
  button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  button.on { background: var(--sel); color: #fff; border-color: var(--sel); box-shadow: none; }
  button.pick.on { background: var(--face); color: var(--ink); border-color: var(--sel);
    box-shadow: inset 0 0 0 2px var(--sel); }
  button:disabled { opacity: .3; box-shadow: none; }
  #clearBtn { color: var(--warn); }
  #shareBtn { background: var(--sel); color: #fff; border-color: var(--sel); }
  #presets button { height: var(--bp); }
  #colors button { height: var(--bc); border-radius: 5px; border-color: rgba(35,45,56,.22); }
  #colors button.on { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px var(--sel); border-color: var(--sel); }
  #pageLabel { display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--muted); }
  #presets button.pressing::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px;
    background: var(--sel); animation: fill .65s linear forwards; }
  #presets button.saved { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  /* Dialog */
  #veil { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none;
    align-items: center; justify-content: center; background: rgba(24,32,40,.38); }
  #veil.show { display: flex; }
  #panel { background: #fff; border-radius: 14px; padding: 20px 24px; width: min(94%, 860px);
    max-height: 92%; overflow-y: auto; box-shadow: 0 18px 44px rgba(20,28,36,.3);
    -webkit-user-select: text; user-select: text; }
  #panel h2 { margin: 0 0 12px; font-size: 21px; }
  #panel h3 { margin: 0 0 6px; font-size: 16px; }
  #panel p, #panel li { font-size: 15px; line-height: 1.45; margin: 5px 0; color: #38444f; }
  #panel ul { margin: 5px 0 0; padding-left: 20px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { border: 1px solid #dbe2e9; border-radius: 10px; padding: 14px 16px; }
  .sep { height: 1px; background: #e2e8ee; margin: 14px 0; }
  #panel input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #c3ccd5;
    border-radius: 8px; width: 100%; margin: 4px 0 8px; background: #fff; color: var(--ink); }
  #panel input.code { font-size: 26px; letter-spacing: .16em; text-align: center;
    text-transform: uppercase; font-weight: 700; }
  #panel button { display: inline-flex; height: 42px; padding: 0 16px; font-size: 15px;
    font-weight: 600; width: auto; vertical-align: middle; }
  #panel button.wide { width: 100%; }
  #panel button.primary { background: var(--sel); color: #fff; border-color: var(--sel); }
  #panel button.danger { color: var(--warn); }
  #panel button.link { height: auto; padding: 2px 0; border: 0; background: none; box-shadow: none;
    color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: underline; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .bigcode { font-size: 42px; font-weight: 800; letter-spacing: .14em; text-align: center;
    padding: 10px 0 2px; font-variant-numeric: tabular-nums; }
  .hint { font-size: 13px; color: var(--muted); }
  .list { margin-top: 10px; max-height: 230px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eaeff4; }
  .row .t { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button { height: 34px; padding: 0 10px; font-size: 14px; }
  .msg { font-size: 14px; margin-top: 8px; min-height: 18px; }
  .msg.err { color: var(--warn); }
  .msg.ok { color: var(--ok); }
  .fold { display: none; }
  .fold.open { display: block; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  @media (max-height: 600px) { :root { --b: 33px; --bp: 25px; --bc: 21px; --gap: 3px; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="sheet">
      <canvas id="bg"></canvas><canvas id="ink"></canvas><canvas id="live"></canvas>
    </div>
    <div id="veil"><div id="panel"></div></div>
  </div>

  <nav id="bar">
    <div class="sec g2">
      <button id="undo" title="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="redo" title="Wiederholen"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button id="clearBtn" title="Seite löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10.5 10.5v6M13.5 10.5v6"/></svg></button>
      <button id="infoBtn" title="Hilfe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6v.2"/></svg></button>
    </div>
    <div class="sec">
      <button id="shareBtn" title="Teilen, Speichern, PDF"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8 15.7 6.5M8.3 13.2l7.4 4.3"/></svg></button>
    </div>

    <div class="rule"></div>
    <div class="sec g2" id="presets"></div>
    <div class="rule"></div>

    <div class="sec g4" id="tools">
      <button data-tool="pen" title="Stift"></button>
      <button data-tool="marker" title="Textmarker"></button>
      <button data-tool="line" title="Gerade"></button>
      <button data-tool="eraser" title="Radierer"></button>
    </div>
    <div class="sec g4" id="sizes">
      <button class="pick" data-size="0" title="Sehr dünn"><i class="sample"></i></button>
      <button class="pick" data-size="1" title="Dünn"><i class="sample"></i></button>
      <button class="pick" data-size="2" title="Mittel"><i class="sample"></i></button>
      <button class="pick" data-size="3" title="Dick"><i class="sample"></i></button>
    </div>
    <div class="sec g4" id="colors"></div>

    <div class="rule"></div>
    <div class="sec g3">
      <button id="prev" title="Vorherige Seite"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="pageLabel">1 / 1</span>
      <button id="next" title="Nächste Seite"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="sec g2">
      <button id="addPage" title="Neue Seite"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="bgBtn" title="Hintergrund wechseln"></button>
    </div>
  </nav>
</div>

<script>
'use strict';
(function () {
  // ============ Blattmaß ============
  // Alle Striche werden in diesem festen Raster gespeichert, unabhängig vom Gerät.
  var SHEET_W = 1920, SHEET_H = 1080;

  // ============ Supabase ============
  var SB_URL = 'https://xzhxqbyobdlyqkyyjcxc.supabase.co';
  var SB_KEY = 'sb_publishable_TlasNLd2Yxq8nxrkgHMnlA_J5-IezYg';
  var SESSION_KEY = 'tafel-session-v1';
  var session = null;

  function loadSession() {
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) { session = null; }
  }
  function storeSession(s) {
    session = s;
    try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function authBody(json) {
    return { method: 'POST', headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
             body: JSON.stringify(json) };
  }
  async function login(email, password) {
    var r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', authBody({ email: email, password: password }));
    var d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.msg || d.message || 'Anmeldung fehlgeschlagen');
    storeSession({ at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in - 60) * 1000,
                   email: d.user && d.user.email, uid: d.user && d.user.id });
    return session;
  }
  async function refresh() {
    if (!session) throw new Error('Nicht angemeldet');
    var r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', authBody({ refresh_token: session.rt }));
    var d = await r.json();
    if (!r.ok) { storeSession(null); throw new Error('Sitzung abgelaufen, bitte neu anmelden'); }
    storeSession({ at: d.access_token, rt: d.refresh_token, exp: Date.now() + (d.expires_in - 60) * 1000,
                   email: (d.user && d.user.email) || session.email, uid: (d.user && d.user.id) || session.uid });
    return session;
  }
  async function token() {
    if (!session) return null;
    if (Date.now() > session.exp) await refresh();
    return session.at;
  }
  async function api(path, opts, needAuth) {
    opts = opts || {};
    var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
    var t = needAuth ? await token() : null;
    h['Authorization'] = 'Bearer ' + (t || SB_KEY);
    if (opts.prefer) h['Prefer'] = opts.prefer;
    var r = await fetch(SB_URL + path, { method: opts.method || 'GET', headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined });
    var txt = await r.text();
    var d = txt ? JSON.parse(txt) : null;
    if (!r.ok) throw new Error((d && (d.message || d.error_description || d.hint)) || ('Fehler ' + r.status));
    return d;
  }
  function rpc(fn, args, needAuth) { return api('/rest/v1/rpc/' + fn, { method: 'POST', body: args }, needAuth); }

  // ============ Konfiguration ============
  var COLORS = [
    { id: 'black',  name: 'Schwarz',    pen: '#1b1b1b', marker: '#8d8d8d' },
    { id: 'gray',   name: 'Grau',       pen: '#5a6672', marker: '#aab4bf' },
    { id: 'brown',  name: 'Braun',      pen: '#7c4a1e', marker: '#c98c4f' },
    { id: 'purple', name: 'Violett',    pen: '#7b1fa2', marker: '#c07ae0' },
    { id: 'navy',   name: 'Dunkelblau', pen: '#123a8f', marker: '#5f86e0' },
    { id: 'blue',   name: 'Blau',       pen: '#1459c7', marker: '#4d94ff' },
    { id: 'sky',    name: 'Hellblau',   pen: '#0a86c4', marker: '#4fc8f5' },
    { id: 'teal',   name: 'Türkis',     pen: '#0d8378', marker: '#3fd3c0' },
    { id: 'dgreen', name: 'Dunkelgrün', pen: '#146b2c', marker: '#4fae67' },
    { id: 'green',  name: 'Grün',       pen: '#1f8a3b', marker: '#4cd46a' },
    { id: 'lime',   name: 'Hellgrün',   pen: '#66a80f', marker: '#a8e63c' },
    { id: 'olive',  name: 'Oliv',       pen: '#8a7a12', marker: '#ccc04a' },
    { id: 'yellow', name: 'Gelb',       pen: '#c29600', marker: '#ffe400' },
    { id: 'orange', name: 'Orange',     pen: '#e8660c', marker: '#ffa233' },
    { id: 'red',    name: 'Rot',        pen: '#d0261d', marker: '#ff5a5a' },
    { id: 'pink',   name: 'Pink',       pen: '#c2185b', marker: '#ff7ab8' }
  ];
  // Werte in Blatt-Einheiten (1920 breit)
  var SIZES = { pen: [2, 4, 8, 16], marker: [18, 30, 48, 74], eraser: [30, 60, 110, 190] };
  var MARKER_ALPHA = 0.4;
  var PALM_MIN = 30;        // Kontaktbreite in CSS-Pixeln
  var LONG_PRESS = 650;
  var PRESET_KEY = 'tafel-presets-v4';
  var DEFAULT_PRESETS = [
    { tool: 'pen', color: 'black', size: 2 }, { tool: 'pen', color: 'blue', size: 2 },
    { tool: 'pen', color: 'red', size: 2 },   { tool: 'pen', color: 'green', size: 2 },
    { tool: 'marker', color: 'yellow', size: 3 }, { tool: 'marker', color: 'green', size: 3 },
    { tool: 'marker', color: 'blue', size: 3 },   { tool: 'marker', color: 'red', size: 3 }
  ];

  var ICON = {
    pen: '<svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    marker: '<svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>',
    line: '<svg viewBox="0 0 24 24"><path d="M4 20 20 4"/><circle cx="4" cy="20" r="1.9"/><circle cx="20" cy="4" r="1.9"/></svg>',
    eraser: '<svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>',
    blank: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>',
    grid: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg>',
    lines: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h10"/></svg>'
  };
  var BG_ORDER = ['blank', 'grid', 'lines'];

  // ============ Zustand ============
  var state = { tool: 'pen', color: 'black', size: { pen: 2, marker: 3, eraser: 1 } };
  var pages = [newPage('blank')], cur = 0;
  var active = new Map();
  var presets = loadPresets();

  function newPage(bg) { return { strokes: [], redo: [], snaps: [], bg: bg }; }
  function colorById(id) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i]; return COLORS[0]; }
  function sizeKey(t) { return t === 'line' ? 'pen' : t; }
  function $(s) { return document.querySelector(s); }
  function $$(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  // ============ Blatt und Canvas ============
  var stage = $('#stage'), sheet = $('#sheet');
  var cBg = $('#bg'), cInk = $('#ink'), cLive = $('#live');
  var xBg = cBg.getContext('2d'), xInk = cInk.getContext('2d'), xLive = cLive.getContext('2d');
  var k = 1;          // CSS-Pixel pro Blatt-Einheit
  var sRect = null;

  function layout() {
    var availW = stage.clientWidth, availH = stage.clientHeight;
    var pad = Math.min(availW, availH) > 420 ? 10 : 0;
    var w = availW - pad * 2, h = availH - pad * 2;
    var sw = w, sh = w * SHEET_H / SHEET_W;
    if (sh > h) { sh = h; sw = h * SHEET_W / SHEET_H; }
    sheet.style.width = sw + 'px';
    sheet.style.height = sh + 'px';
    sheet.style.left = Math.round((availW - sw) / 2) + 'px';
    sheet.style.top = Math.round((availH - sh) / 2) + 'px';

    k = sw / SHEET_W;
    var dpr = window.devicePixelRatio || 1;
    var px = Math.round(sw * dpr), py = Math.round(sh * dpr);
    [cBg, cInk, cLive].forEach(function (c) { c.width = px; c.height = py; });
    var m = (px / SHEET_W);
    [xBg, xInk, xLive].forEach(function (x) { x.setTransform(m, 0, 0, m, 0, 0); });

    sRect = sheet.getBoundingClientRect();
    drawBg(); redrawInk(); requestLive();
  }

  function drawBg() {
    var p = pages[cur];
    xBg.fillStyle = '#fff';
    xBg.fillRect(0, 0, SHEET_W, SHEET_H);
    xBg.lineWidth = 1.4;
    xBg.beginPath();
    if (p.bg === 'grid') {
      xBg.strokeStyle = '#d6dee7';
      for (var x = 64; x < SHEET_W; x += 64) { xBg.moveTo(x, 0); xBg.lineTo(x, SHEET_H); }
      for (var y = 64; y < SHEET_H; y += 64) { xBg.moveTo(0, y); xBg.lineTo(SHEET_W, y); }
    } else if (p.bg === 'lines') {
      xBg.strokeStyle = '#c5d3e0';
      for (var y2 = 90; y2 < SHEET_H; y2 += 90) { xBg.moveTo(0, y2); xBg.lineTo(SHEET_W, y2); }
    }
    xBg.stroke();
  }

  function strokePath(ctx, s) {
    var p = s.pts, n = p.length / 2;
    ctx.save();
    if (s.kind === 'erase') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = ctx.fillStyle = '#000';
    } else {
      ctx.strokeStyle = ctx.fillStyle = s.color;
      ctx.globalAlpha = s.kind === 'marker' ? MARKER_ALPHA : 1;
    }
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (n === 1) {
      ctx.arc(p[0], p[1], s.w / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.kind === 'line' || n === 2) {
      ctx.moveTo(p[0], p[1]);
      ctx.lineTo(p[2 * n - 2], p[2 * n - 1]);
      ctx.stroke();
    } else {
      ctx.moveTo(p[0], p[1]);
      for (var i = 1; i < n - 1; i++) {
        var x = p[2 * i], y = p[2 * i + 1];
        ctx.quadraticCurveTo(x, y, (x + p[2 * i + 2]) / 2, (y + p[2 * i + 3]) / 2);
      }
      ctx.lineTo(p[2 * n - 2], p[2 * n - 1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  function eraseIncrement(s, from) {
    var p = s.pts;
    xInk.save();
    xInk.globalCompositeOperation = 'destination-out';
    xInk.strokeStyle = '#000'; xInk.lineWidth = s.w; xInk.lineCap = 'round'; xInk.lineJoin = 'round';
    xInk.beginPath(); xInk.moveTo(p[from - 2], p[from - 1]);
    for (var i = from; i < p.length; i += 2) xInk.lineTo(p[i], p[i + 1]);
    xInk.stroke(); xInk.restore();
  }

  function redrawInk() {
    xInk.clearRect(0, 0, SHEET_W, SHEET_H);
    pages[cur].strokes.forEach(function (s) { strokePath(xInk, s); });
  }

  var livePending = false;
  function requestLive() {
    if (livePending) return;
    livePending = true;
    requestAnimationFrame(function () {
      livePending = false;
      xLive.clearRect(0, 0, SHEET_W, SHEET_H);
      active.forEach(function (s) { if (s.kind !== 'erase') strokePath(xLive, s); });
    });
  }

  // ============ Zeichnen ============
  function pt(e) { return { x: (e.clientX - sRect.left) / k, y: (e.clientY - sRect.top) / k }; }
  function contact(e) { return Math.max(e.width || 0, e.height || 0); }
  function isPalm(e) { return e.pointerType !== 'mouse' && contact(e) >= PALM_MIN; }
  function palmWidth(e) { return Math.max(60, (contact(e) * 1.6) / k); }

  cLive.addEventListener('pointerdown', function (e) {
    if ($('#veil').classList.contains('show')) return;
    e.preventDefault();
    try { cLive.setPointerCapture(e.pointerId); } catch (err) {}
    var p = pt(e), s, c = colorById(state.color);
    if (isPalm(e)) {
      s = { kind: 'erase', w: palmWidth(e), pts: [p.x, p.y] };
    } else if (state.tool === 'eraser') {
      s = { kind: 'erase', w: SIZES.eraser[state.size.eraser], pts: [p.x, p.y] };
    } else if (state.tool === 'line') {
      s = { kind: 'line', color: c.pen, w: SIZES.pen[state.size.pen], pts: [p.x, p.y, p.x, p.y] };
    } else {
      s = { kind: state.tool, color: state.tool === 'marker' ? c.marker : c.pen,
            w: SIZES[state.tool][state.size[state.tool]], pts: [p.x, p.y] };
    }
    active.set(e.pointerId, s);
    if (s.kind === 'erase') strokePath(xInk, s); else requestLive();
  });

  cLive.addEventListener('pointermove', function (e) {
    var s = active.get(e.pointerId);
    if (!s) return;

    if (s.kind === 'line') {                 // Gerade: nur der Endpunkt wandert
      var q = pt(e);
      s.pts[2] = q.x; s.pts[3] = q.y;
      requestLive();
      return;
    }
    if (isPalm(e)) {
      if (s.kind !== 'erase') {
        s.kind = 'erase'; delete s.color; s.w = palmWidth(e);
        strokePath(xInk, s); requestLive();
      } else {
        s.w = Math.max(s.w, palmWidth(e));
      }
    }
    var list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!list || !list.length) list = [e];
    var start = s.pts.length;
    for (var i = 0; i < list.length; i++) {
      var r = pt(list[i]);
      var lx = s.pts[s.pts.length - 2], ly = s.pts[s.pts.length - 1];
      if (Math.abs(r.x - lx) + Math.abs(r.y - ly) < 1.2) continue;
      s.pts.push(r.x, r.y);
    }
    if (s.pts.length === start) return;
    if (s.kind === 'erase') eraseIncrement(s, start); else requestLive();
  });

  function endStroke(e) {
    var s = active.get(e.pointerId);
    if (!s) return;
    active['delete'](e.pointerId);
    if (s.kind !== 'erase') strokePath(xInk, s);
    var pg = pages[cur];
    pg.strokes.push(s); pg.redo.length = 0;
    requestLive(); updateUI();
  }
  cLive.addEventListener('pointerup', endStroke);
  cLive.addEventListener('pointercancel', endStroke);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ============ Speicherformat ============
  function r1(n) { return Math.round(n * 10) / 10; }
  function serialize() {
    return { v: 2, w: SHEET_W, h: SHEET_H,
      pages: pages.map(function (p) {
        return { bg: p.bg, s: p.strokes.map(function (st) {
          return { k: st.kind, c: st.color || null, w: r1(st.w), p: st.pts.map(r1) };
        }) };
      }) };
  }
  function deserialize(d) {
    if (!d || !d.pages) throw new Error('Unbekanntes Format');
    // Ältere Tafelbilder lagen in Bildschirmpixeln vor und werden hochgerechnet.
    var sc = d.v >= 2 ? 1 : (SHEET_W / (d.w || SHEET_W));
    return d.pages.map(function (p) {
      var pg = newPage(p.bg || 'blank');
      pg.strokes = (p.s || []).map(function (st) {
        var o = { kind: st.k, w: st.w * sc, pts: st.p.map(function (n) { return n * sc; }) };
        if (st.c) o.color = st.c;
        return o;
      });
      return pg;
    });
  }
  function isEmpty() { return pages.length === 1 && !pages[0].strokes.length; }
  function applyPages(np) {
    if (!np.length) return;
    if (isEmpty()) { pages = np; cur = 0; }
    else { var at = pages.length; pages = pages.concat(np); cur = at; }
    active.clear(); drawBg(); redrawInk(); requestLive(); updateUI();
  }

  // ============ Export ============
  function renderPageTo(ctx, pg, scale) {
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, SHEET_W, SHEET_H);
    ctx.lineWidth = 1.4; ctx.beginPath();
    if (pg.bg === 'grid') {
      ctx.strokeStyle = '#d6dee7';
      for (var x = 64; x < SHEET_W; x += 64) { ctx.moveTo(x, 0); ctx.lineTo(x, SHEET_H); }
      for (var y = 64; y < SHEET_H; y += 64) { ctx.moveTo(0, y); ctx.lineTo(SHEET_W, y); }
    } else if (pg.bg === 'lines') {
      ctx.strokeStyle = '#c5d3e0';
      for (var y2 = 90; y2 < SHEET_H; y2 += 90) { ctx.moveTo(0, y2); ctx.lineTo(SHEET_W, y2); }
    }
    ctx.stroke();
    pg.strokes.forEach(function (s) { strokePath(ctx, s); });
    ctx.restore();
  }

  function pageCanvas(pg, scale) {
    var c = document.createElement('canvas');
    c.width = Math.round(SHEET_W * scale);
    c.height = Math.round(SHEET_H * scale);
    renderPageTo(c.getContext('2d'), pg, scale);
    return c;
  }

  function stamp() {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes());
  }
  function download(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); }, 0);
  }

  // Minimaler PDF-Schreiber: bettet je Seite ein JPEG ein (DCTDecode, ohne Umkodierung).
  // Bewusst ohne externe Bibliothek, damit nichts aus dem Netz nachgeladen werden muss.
  function dataUrlToBytes(url) {
    var bin = atob(url.slice(url.indexOf(',') + 1));
    var a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }

  function buildPDF(imgs, pw, ph, box) {
    var parts = [], len = 0, off = [];
    function raw(s) {
      var a = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xff;
      return a;
    }
    function put(x) { var a = (typeof x === 'string') ? raw(x) : x; parts.push(a); len += a.length; }
    function obj(n, dict, stream) {
      off[n] = len;
      put(n + ' 0 obj\n' + dict + '\n');
      if (stream) { put('stream\n'); put(stream); put('\nendstream\n'); }
      put('endobj\n');
    }
    function f(v) { return (Math.round(v * 100) / 100).toString(); }

    var N = imgs.length, kids = [], i;
    for (i = 0; i < N; i++) kids.push((3 + i * 3) + ' 0 R');

    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>');

    for (i = 0; i < N; i++) {
      var pn = 3 + i * 3, im = pn + 1, ct = pn + 2, g = imgs[i];
      var content = 'q ' + f(box.w) + ' 0 0 ' + f(box.h) + ' ' + f(box.x) + ' ' + f(box.y) + ' cm /Im0 Do Q';
      obj(pn, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + f(pw) + ' ' + f(ph) +
        '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>');
      obj(im, '<< /Type /XObject /Subtype /Image /Width ' + g.w + ' /Height ' + g.h +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + g.data.length + ' >>', g.data);
      obj(ct, '<< /Length ' + content.length + ' >>', content);
    }

    var max = 2 + N * 3, xref = len, rows = '';
    for (i = 1; i <= max; i++) rows += ('0000000000' + off[i]).slice(-10) + ' 00000 n \n';
    put('xref\n0 ' + (max + 1) + '\n0000000000 65535 f \n' + rows);
    put('trailer\n<< /Size ' + (max + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

    return new Blob(parts, { type: 'application/pdf' });
  }

  function exportPDF() {
    // A4 quer in Punkten (1 pt = 1/72 Zoll)
    var pw = 841.89, ph = 595.28, margin = 14;
    var iw = pw - margin * 2, ih = iw * SHEET_H / SHEET_W;
    var box = { w: iw, h: ih, x: margin, y: (ph - ih) / 2 };
    var imgs = pages.map(function (pg) {
      var c = pageCanvas(pg, 2);
      return { w: c.width, h: c.height, data: dataUrlToBytes(c.toDataURL('image/jpeg', 0.9)) };
    });
    var url = URL.createObjectURL(buildPDF(imgs, pw, ph, box));
    download(url, 'Tafelbild_' + stamp() + '.pdf');
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function exportPNG() {
    pageCanvas(pages[cur], 2).toBlob(function (b) {
      var u = URL.createObjectURL(b);
      download(u, 'Tafelbild_' + stamp() + '_S' + (cur + 1) + '.png');
      setTimeout(function () { URL.revokeObjectURL(u); }, 20000);
    }, 'image/png');
  }

  onTap($('#infoBtn'), showInfo);
  onTap($('#shareBtn'), showShare);

  function gotoPage(i) {
    if (i < 0 || i >= pages.length) return;
    active.clear(); cur = i;
    drawBg(); redrawInk(); requestLive(); updateUI();
  }
  onTap($('#prev'), function () { gotoPage(cur - 1); });
  onTap($('#next'), function () { gotoPage(cur + 1); });
  onTap($('#addPage'), function () { pages.splice(cur + 1, 0, newPage(pages[cur].bg)); gotoPage(cur + 1); });
  onTap($('#bgBtn'), function () {
    var pg = pages[cur];
    pg.bg = BG_ORDER[(BG_ORDER.indexOf(pg.bg) + 1) % BG_ORDER.length];
    drawBg(); updateUI();
  });

  function updateUI() {
    var col = colorById(state.color);
    $$('#tools button').forEach(function (b) { b.classList.toggle('on', b.dataset.tool === state.tool); });
    $$('#colors button').forEach(function (b) {
      b.classList.toggle('on', state.tool !== 'eraser' && b.dataset.color === state.color);
    });
    $$('#sizes button').forEach(function (b, i) {
      b.classList.toggle('on', state.size[sizeKey(state.tool)] === i);
      styleSample(b.firstElementChild, state.tool, col, i);
    });
    presetBtns.forEach(function (b, i) {
      renderPreset(b, presets[i]);
      b.classList.toggle('on', presetMatches(presets[i]));
    });
    var pg = pages[cur];
    $('#pageLabel').textContent = (cur + 1) + ' / ' + pages.length;
    $('#prev').disabled = cur === 0;
    $('#next').disabled = cur === pages.length - 1;
    $('#undo').disabled = !pg.strokes.length && !pg.snaps.length;
    $('#redo').disabled = !pg.redo.length;
    $('#clearBtn').disabled = !pg.strokes.length;
    $('#bgBtn').innerHTML = ICON[pg.bg];
  }

  loadSession();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 250); });
  layout();
  updateUI();
})();
</script>
</body>
</html>
