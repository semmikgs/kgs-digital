<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einheitenwandler · Tafelwerk</title>
  <style>
    :root { --paper:#f3efe6; --cream:#fffdf8; --ink:#1a1714; --muted:#6b6560; --accent:#1e3a5f; --line:#e2dcd0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.45; }
    .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--cream); }
    .bar a { color:var(--muted); text-decoration:none; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .wrap { max-width:880px; margin:0 auto; padding:18px; display:grid; gap:16px; }
    .card { background:var(--cream); border:1px solid var(--line); border-radius:16px; padding:16px; }
    button, input, select { font:inherit; color:var(--ink); border:1px solid var(--line); background:var(--cream); border-radius:8px; min-height:44px; }
    button { cursor:pointer; padding:8px 14px; }
    button.on { background:var(--accent); color:var(--cream); border-color:var(--accent); }
    label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
    input, select { width:100%; padding:8px 10px; }
    .muted { color:var(--muted); }
    .stairs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
    .step { flex:1; min-width:70px; text-align:center; border:1px solid var(--line); border-radius:10px; padding:10px 6px; background:var(--paper); }
    .step.active { background:var(--accent); color:var(--cream); border-color:var(--accent); }
    .step .u { font-size:14px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    html.embed .bar { display:none; }
  </style>
</head>
<body>
  <header class="bar">
    <a href="/">Tafelwerk</a>
    <strong>Einheitenwandler</strong>
    <span class="muted">Mathematik · Kl. 5–10</span>
  </header>
  <main class="wrap">
    <section class="card">
      <div class="row" id="cats"></div>
      <label for="val">Wert</label>
      <input id="val" inputmode="decimal" value="3,5" />
      <label for="from">Von</label>
      <select id="from"></select>
      <label for="to">Nach</label>
      <select id="to"></select>
      <p id="out" style="font-size:1.4rem; font-variant-numeric:tabular-nums; margin:16px 0 8px"></p>
      <p class="muted" id="how"></p>
    </section>
    <section class="card">
      <p class="muted" style="margin:0 0 12px">Treppe — der aktive Schritt ist die gewählte Einheit.</p>
      <div class="stairs" id="stairs"></div>
    </section>
  </main>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      if (q.has("embed") || window.self !== window.top) document.documentElement.classList.add("embed");
      const CATS = {
        laenge: {
          label: "Länge",
          base: "m",
          hint: "Jede Stufe Länge ist Faktor 10 (Komma um eine Stelle).",
          units: [["km", 1000], ["hm", 100], ["dam", 10], ["m", 1], ["dm", 0.1], ["cm", 0.01], ["mm", 0.001]],
        },
        flaeche: {
          label: "Fläche",
          base: "m²",
          hint: "Jede Stufe Fläche ist Faktor 100 (Komma um zwei Stellen).",
          units: [["km²", 1e6], ["ha", 1e4], ["a", 100], ["m²", 1], ["dm²", 0.01], ["cm²", 1e-4], ["mm²", 1e-6]],
        },
        volumen: {
          label: "Volumen",
          base: "m³",
          hint: "1 l = 1 dm³, 1 ml = 1 cm³. Stufe Volumen oft Faktor 1000.",
          units: [["m³", 1], ["l", 0.001], ["dm³", 0.001], ["ml", 1e-6], ["cm³", 1e-6], ["mm³", 1e-9]],
        },
        masse: {
          label: "Masse",
          base: "g",
          hint: "1 t = 1000 kg, 1 kg = 1000 g, 1 g = 1000 mg.",
          units: [["t", 1e6], ["kg", 1000], ["g", 1], ["mg", 0.001]],
        },
        zeit: {
          label: "Zeit",
          base: "s",
          hint: "Über Sekunden: 1 h = 60 min = 3600 s.",
          units: [["h", 3600], ["min", 60], ["s", 1], ["ms", 0.001]],
        },
        daten: {
          label: "Daten",
          base: "B",
          hint: "Hier dezimal (1000). 1 Byte = 8 bit.",
          units: [["GB", 1e9], ["MB", 1e6], ["kB", 1000], ["B", 1], ["bit", 0.125]],
        },
      };
      let cat = "laenge";
      const catsEl = document.getElementById("cats");
      Object.entries(CATS).forEach(([id, c]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = c.label; b.dataset.id = id;
        b.addEventListener("click", () => { cat = id; fillUnits(); paint(); });
        catsEl.appendChild(b);
      });
      const from = document.getElementById("from");
      const to = document.getElementById("to");
      const val = document.getElementById("val");

      function fillUnits() {
        const c = CATS[cat];
        from.innerHTML = c.units.map((u, i) => '<option value="'+i+'">'+u[0]+"</option>").join("");
        to.innerHTML = from.innerHTML;
        to.selectedIndex = Math.min(c.units.length - 1, 3);
      }
      function parse() {
        const n = Number(String(val.value).trim().replace(",", "."));
        return Number.isFinite(n) ? n : null;
      }
      function fmt(n) {
        if (n === 0) return "0";
        const abs = Math.abs(n);
        const digits = abs >= 1000 ? 4 : abs >= 1 ? 6 : 10;
        return n.toLocaleString("de-DE", { maximumFractionDigits: digits });
      }
      function paint() {
        [...catsEl.children].forEach((b) => b.classList.toggle("on", b.dataset.id === cat));
        const c = CATS[cat];
        const n = parse();
        const uFrom = c.units[Number(from.value)] || c.units[0];
        const uTo = c.units[Number(to.value)] || c.units[0];
        if (n === null) {
          document.getElementById("out").textContent = "Zahl eingeben.";
          document.getElementById("how").textContent = "";
          draw(null, null);
          return;
        }
        const res = n * uFrom[1] / uTo[1];
        document.getElementById("out").textContent = fmt(n) + " " + uFrom[0] + " = " + fmt(res) + " " + uTo[0];
        const ratio = uFrom[1] / uTo[1];
        document.getElementById("how").textContent = c.hint + " Faktor " + fmt(ratio) + ".";
        draw(uFrom, uTo);
      }
      function draw(uFrom, uTo) {
        const box = document.getElementById("stairs");
        const c = CATS[cat];
        box.replaceChildren();
        c.units.forEach((u) => {
          const d = document.createElement("div");
          const on = (uFrom && u[0] === uFrom[0]) || (uTo && u[0] === uTo[0]);
          d.className = "step" + (on ? " active" : "");
          d.innerHTML = '<div class="u">'+u[0]+"</div>";
          box.appendChild(d);
        });
      }
      fillUnits();
      [val, from, to].forEach((el) => el.addEventListener("input", paint));
      paint();
    })();
  </script>
</body>
</html>
