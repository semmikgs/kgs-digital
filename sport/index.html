<!-- Nur diese drei Zeilen anpassen, wenn du diese Seite in einen
     neuen Fachbereichsordner kopierst. -->
<script>
const FACH = {
  titel:      "Sport",
  symbol:     "🏃",
  untertitel: "Leichtathletik, Messen und Auswerten (im Aufbau)"
};
</script>
<script src="../assets/kgs.js"></script>
<script>
/* Offline-Speicher für den Sport-Bereich (../offline-sw.js): Startseite, diese Übersicht und alle Sport-Tools.
   Einmal mit Netz öffnen und warten, bis „Offline bereit“ erscheint – dann geht alles auf dem Sportplatz ohne Netz. */
(function () {
  const z = document.getElementById('offline');
  const zeig = (t, farbe) => { z.textContent = t; z.style.color = farbe || ''; z.style.fontWeight = farbe ? '700' : ''; };
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) {
    zeig('⚠️ Offline-Nutzung ist in diesem Browser nicht möglich. Bitte das Portal in Safari öffnen.', '#c0392b'); return;
  }
  (async () => {
    try {
      for (const r of await navigator.serviceWorker.getRegistrations()) if (/\/sport\/tools\/$/.test(r.scope)) await r.unregister();
      const reg = await navigator.serviceWorker.register('../offline-sw.js').catch(() => navigator.serviceWorker.ready);   // offline: vorhandene Anmeldung nutzen
      const frage = () => {
        const w = reg.active || reg.waiting || reg.installing; if (!w) { setTimeout(frage, 1500); return; }
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => {
          const d = e.data || {};
          if (d.ok) zeig('✅ Offline bereit – Sport-Tools funktionieren auf dem Sportplatz ohne Netz. Tipp: in Safari über „Teilen → Zum Home-Bildschirm“ ablegen.', '#1f9d55');
          else { zeig(`⏳ Offline-Speicher wird geladen … ${d.n || 0} von ${d.total || '…'} Dateien (ca. 25 MB) – Seite bitte offen lassen.`, '#e07b00'); setTimeout(frage, 2000); }
        };
        w.postMessage('status', [ch.port2]);
      };
      frage();
    } catch (e) { zeig('⚠️ Offline-Speicher konnte nicht angelegt werden: ' + e.message, '#c0392b'); }
  })();
})();
</script>
</body>
</html>
